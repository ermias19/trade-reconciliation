[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-reconciliation"
version = "0.1.0"
description = "Post-trade reconciliation, settlement monitoring, FX netting, hedge tracking, corporate actions and regulatory reporting"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recon = "trade_recon.cli:main"
hedge-check = "trade_recon.extras_cli:hedges_main"
corp-actions = "trade_recon.extras_cli:corp_actions_main"
reg-report = "trade_recon.extras_cli:reg_report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
